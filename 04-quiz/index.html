    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const progressFill = document.getElementById("progress-fill");
    const resultPanel = document.getElementById("result-panel");
    const resultScore = document.getElementById("result-score");
    const resultMessage = document.getElementById("result-message");
    const quizList = document.getElementById("quiz-list");

    function escapeHtml(value) {
      return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatInline(value) {
      const escaped = escapeHtml(value);
      return escaped.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
    }

    function highlightCode(value) {
      let output = escapeHtml(value);
      output = output.replace(/(\/\/.*)$/gm, '<span class="token-comment">$1</span>');
      output = output.replace(/\b(let|const|var|typeof)\b/g, '<span class="token-keyword">$1</span>');
      output = output.replace(/\b(prompt|console\.log|Number|parseInt|String|toString)\b/g, '<span class="token-function">$1</span>');
      output = output.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, '<span class="token-string">$1</span>');
      output = output.replace(/(`[^`]*`)/g, '<span class="token-template">$1</span>');
      output = output.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="token-number">$1</span>');
      return output;
    }

    function renderQuiz() {
      quizList.innerHTML = quiz.map((item, index) => {
        const letters = ["A","B","C","D"];
        const answers = item.answers.map((answer, answerIndex) => `
          <button class="answer flex gap-3 rounded-xl p-4" data-option="${letters[answerIndex]}" type="button" role="radio" aria-checked="false">
            <span class="letter flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-sm font-bold">${letters[answerIndex]}</span>
            <span class="answer-copy">${formatInline(answer)}</span>
          </button>
        `).join("");

        return `
          <section id="q${index + 1}" class="question-card rounded-2xl border border-[#e8ebee] bg-[#fafafa] p-5" data-correct="${item.correct}">
            <p class="mb-2 text-sm font-bold uppercase tracking-[.18em] text-[#fa6432]">Vraag ${index + 1}</p>
            <h2 class="mb-${item.code ? "4" : "5"} text-xl font-semibold leading-relaxed text-[#000a1e]">${formatInline(item.question)}</h2>
            ${item.code ? `<pre class="code-block mb-5"><code>${highlightCode(item.code)}</code></pre>` : ""}
            <div class="space-y-3" role="radiogroup" aria-label="Antwoorden voor vraag ${index + 1}">
              ${answers}
            </div>
            <div class="feedback mt-5 rounded-r-xl p-4">
              <p>${formatInline(item.feedback)}</p>
            </div>
          </section>
        `;
      }).join("");

      bindAnswerEvents();
    }

    function updateProgress() {
      progressText.textContent = `Vraag ${answeredCount} van ${totalQuestions}`;
      scoreText.textContent = `Score: ${correctCount}`;
      progressFill.style.width = `${answeredCount / totalQuestions * 100}%`;
    }

    function showResults() {
      const percentage = Math.round(correctCount / totalQuestions * 100);
      resultScore.textContent = `Je behaalde ${correctCount} van de ${totalQuestions} juiste antwoorden (${percentage}%).`;
      resultMessage.textContent = percentage >= 80
        ? "Sterk werk! Je beheerst de kernconcepten al heel goed."
        : percentage >= 50
          ? "Goed bezig! Bekijk de uitleg bij de vragen die nog lastig waren."
          : "Blijf oefenen: de uitleg bij elke vraag helpt je om de concepten beter te begrijpen.";

      resultPanel.classList.add("show");
      resultPanel.scrollIntoView({ behavior:"smooth", block:"center" });
    }

    function checkIfAllWrong(card) {
      const correct = card.dataset.correct;
      const wrongAnswers = Array.from(card.querySelectorAll(".answer")).filter(
        btn => btn.dataset.option !== correct
      );
      return wrongAnswers.every(btn => btn.classList.contains("is-incorrect"));
    }

    function revealCorrectAnswer(card) {
      const correct = card.dataset.correct;
      card.querySelectorAll(".answer").forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.option === correct) {
          choice.classList.add("is-revealed", "is-correct");
        }
      });
      card.classList.add("answered");
      card.querySelector(".feedback").classList.add("show");

      answeredCount += 1;
      correctCount += 1;

      updateProgress();

      if (answeredCount === totalQuestions) {
        showResults();
      }
    }

    function bindAnswerEvents() {
      document.querySelectorAll(".question-card").forEach(card => {
        card.querySelectorAll(".answer").forEach(button => {
          button.addEventListener("click", () => {
            if (card.classList.contains("answered")) return;

            const correct = card.dataset.correct;
            const isCorrect = button.dataset.option === correct;

            if (isCorrect) {
              button.classList.add("is-correct");
              revealCorrectAnswer(card);
            } else {
              button.classList.add("is-incorrect");
              button.disabled = true;
              button.setAttribute("aria-checked", "false");

              if (checkIfAllWrong(card)) {
                revealCorrectAnswer(card);
              }
            }
          });
        });
      });
    }

    document.getElementById("restart-button").addEventListener("click", () => {
      answeredCount = 0;
      correctCount = 0;
      resultPanel.classList.remove("show");

      document.querySelectorAll(".question-card").forEach(card => {
        card.classList.remove("answered");
        card.querySelector(".feedback").classList.remove("show");

        card.querySelectorAll(".answer").forEach(button => {
          button.disabled = false;
          button.setAttribute("aria-checked", "false");
          button.classList.remove("is-correct", "is-incorrect", "is-revealed");
        });
      });

      updateProgress();
      document.getElementById("q1").scrollIntoView({ behavior:"smooth", block:"start" });
    });

    renderQuiz();
    updateProgress();
    lucide.createIcons();
  </script>
 
</body></html>

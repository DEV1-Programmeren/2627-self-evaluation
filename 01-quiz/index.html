  <script>
    const quiz = [
      {
        question:"Wat is het verschil tussen het declareren en initialiseren van een variabele?",
        answers:[
          "Declareren geeft de variabele een naam, initialiseren voegt de functie `console.log()` toe",
          "Declareren reserveert geheugen, initialiseren wijst een waarde toe",
          "Declareren betekent een `const` gebruiken, initialiseren betekent een `let` gebruiken",
          "Er is geen verschil, het zijn synoniemen"
        ],
        correct:"B",
        feedback:"Declareren reserveert een plekje in het geheugen, initialiseren geeft dat plekje een waarde."
      },
      {
        question:"Je schrijft een programma dat de score van een speler bijhoudt. De score kan tijdens het spel veranderen. Welke declaratie is het meest geschikt?",
        answers:[
          "`const score = 0;` omdat je de score niet meer mag veranderen",
          "`let score = 0;` omdat de score nog zal veranderen",
          "`var score = 0;` omdat var ontworpen is voor scores",
          "`score = 0;` zonder let of const, dat is het eenvoudigst"
        ],
        correct:"B",
        feedback:"Gebruik `let` als een waarde gaat veranderen, en `const` als ze constant blijft."
      },
      {
        question:"Wat doet `console.log(3 + 4)`?",
        answers:[
          "Toont het resultaat van de optelling (`7`) in het console-paneel",
          "Voert de optelling uit maar toont niets",
          "Creëert een fout omdat je niet kan optellen in `console.log()`",
          "Toont de tekst `3 + 4` letterlijk in het console-paneel"
        ],
        correct:"A",
        feedback:"`console.log()` voert alles uit wat erin staat en toont het resultaat."
      },
      {
        question:"Welke uitspraak over `prompt()` klopt?",
        answers:[
          "`prompt()` geeft altijd een getal terug",
          "`prompt()` geeft altijd een string terug, zelfs als de gebruiker een getal intikt",
          "`prompt()` geeft een boolean terug",
          "`prompt()` vraagt nooit invoer, het toont alleen berichten"
        ],
        correct:"B",
        feedback:"`prompt()` geeft altijd een string terug, dus je moet omzetten met `Number()` als je ermee wil rekenen."
      },
      {
        question:"Welk datatype heeft de waarde `undefined`?",
        answers:["`string`","`number`","`undefined`","`null`"],
        correct:"C",
        feedback:"`undefined` is zelf een datatype, gebruikt voor variabelen die gedeclareerd maar niet geïnitialiseerd zijn."
      },
      {
        question:"Welk van deze is een string?",
        answers:["`42`","`true`","`\"Hallo\"`","`undefined`"],
        correct:"C",
        feedback:"Strings staan altijd tussen aanhalingstekens. `42` zonder aanhalingstekens is een number."
      },
      {
        question:"Je hebt deze code. Wat gebeurt er als de gebruiker `3` intikt?",
        code:`let antwoord = prompt("Geef een getal:");
let getal = antwoord + 5;`,
        answers:[
          "`getal` wordt `8` (3 + 5)",
          "`getal` wordt `\"35\"` (tekst aan elkaar plakken)",
          "Er ontstaat een fout",
          "`getal` wordt `undefined`"
        ],
        correct:"B",
        feedback:"Je voegt een string (`\"3\"`) en een getal (`5`) samen, dus JavaScript plakt ze aan elkaar als tekst."
      },
      {
        question:"Wat is het verschil tussen `Number(antwoord)` en `parseInt(antwoord)` als `antwoord = \"42.5\"`?",
        answers:[
          "`Number()` geeft `42` en `parseInt()` geeft `42.5`",
          "`Number()` geeft `42.5` en `parseInt()` geeft `42`",
          "Ze geven altijd hetzelfde resultaat",
          "`Number()` werkt niet op strings"
        ],
        correct:"B",
        feedback:"`Number()` behoudt kommagetallen, `parseInt()` haalt alles na de komma eraf."
      },
      {
        question:"Wat is het resultaat van `10 % 3`?",
        answers:["`3` (10 gedeeld door 3)","`1` (de rest van 10 gedeeld door 3)","`3.333...` (10 gedeeld door 3 met komma)","`0` (modulo geeft altijd 0)"],
        correct:"B",
        feedback:"`%` is de modulo-operator, die geeft de rest na deling. 10 gedeeld door 3 is 3 rest 1."
      },
      {
        question:"Wat is het resultaat van `2 + 3 * 4`?",
        answers:["`20` (eerst 2 + 3, dan * 4)","`14` (eerst 3 * 4, dan + 2)","Dit geeft een fout","`9` (snel achter elkaar berekend)"],
        correct:"B",
        feedback:"Vermenigvuldiging gaat voor optelling."
      },
      {
        question:"Wat doet `x++`?",
        answers:["Geeft x toe aan de volgende variabele","Verhoogt x met 1 (zelfde als `x = x + 1`)","Geeft de volgende waarde","Voegt een comment toe"],
        correct:"B",
        feedback:"`x++` is een verkorte notatie voor `x = x + 1`."
      },
      {
        question:"JavaScript is loosely typed. Wat betekent dat?",
        answers:["JavaScript-code is makkelijk geschreven","Variabelen kunnen van datatype veranderen zonder fouten","Je hoeft niet op Enter te drukken na je code","JavaScript accepteert minder datatypes dan andere talen"],
        correct:"B",
        feedback:"In JavaScript hoef je het datatype niet van tevoren op te geven, en het kan veranderen."
      },
      {
        question:"Welke syntax is correct voor template strings?",
        answers:["`\"${naam} is 20 jaar\"`","`'${naam} is 20 jaar'`","`` `${naam} is 20 jaar` ``","`[${naam} is 20 jaar]`"],
        correct:"C",
        feedback:"Template strings gebruiken backticks, niet gewone aanhalingstekens. Variabelen gaan tussen `${}`."
      },
      {
        question:"Je hebt variabelen `naam = \"Sofie\"` en `leeftijd = 21`. Welke regel geeft hetzelfde resultaat als de codevoorbeelden?",
        code:`// Optie A:
console.log(\`\${naam} is \${leeftijd} jaar oud.\`);

// Optie B:
console.log(naam + " is " + leeftijd + " jaar oud.");`,
        answers:["Alleen optie A","Alleen optie B","Beide geven hetzelfde resultaat","Geen van beide werkt"],
        correct:"C",
        feedback:"Template strings zijn overzichtelijker dan concatenatie met `+`, maar het resultaat is identiek."
      },
      {
        question:"Wat gebeurt er met code na `//` op dezelfde regel?",
        answers:["Het wordt uitgevoerd","Het wordt genegeerd door JavaScript","Het voegt een comment toe aan de console","Het veroorzaakt een fout"],
        correct:"B",
        feedback:"`//` geeft aan dat alles daarna op die regel een comment is en niet wordt uitgevoerd."
      },
      {
        question:"Wat geeft `typeof \"hello\"` als resultaat?",
        answers:["`string`","`\"string\"`","`text`","`\"hello\"`"],
        correct:"B",
        feedback:"`typeof` geeft altijd een stringwaarde terug. In de console wordt die weergegeven als `\"string\"`."
      },
      {
        question:"Je wil het getal `42` omzetten naar een string. Welke regel doet dat?",
        answers:["`let tekst = parseInt(42);`","`let tekst = String(42);`","`let tekst = (42).toString();`","Beide B en C"],
        correct:"D",
        feedback:"Beide manieren werken: `String(42)` en `(42).toString()` zetten het getal om naar een string."
      },
      {
        question:"Wat is het verschil tussen `null` en `undefined`?",
        answers:["`undefined` is een getal, `null` is tekst","`undefined` is automatisch (geen waarde toegekend), `null` is bewust (jij kent het toe)","Ze zijn identiek","`null` bestaat niet in JavaScript"],
        correct:"B",
        feedback:"`undefined` betekent dat er nog geen waarde is; `null` betekent dat je bewust geen waarde toekent."
      },
      {
        question:"Je wil gebruiker vragen om hun geboortejaar, en dan hun leeftijd berekenen (huidigjaar - geboortejaar). Welke code is CORRECT?",
        answers:[
          "`let jaar = prompt(\"Geboortejaar?\"); let leeftijd = 2026 - jaar;`",
          "`let jaar = Number(prompt(\"Geboortejaar?\")); let leeftijd = 2026 - jaar;`",
          "`let jaar = prompt(\"Geboortejaar?\"); let leeftijd = 2026 - Number(jaar);`",
          "Beide B en C zijn correct"
        ],
        correct:"D",
        feedback:"In beide gevallen zet je de string om naar een number voordat je ermee rekent."
      },
      {
        question:"Waarom is `console.log()` nuttig bij programmeren?",
        answers:["Om het eindresultaat aan gebruikers te tonen","Om te controleren of variabelen de waarden hebben die je verwacht (debuggen)","Om fouten automatisch op te lossen","Om code sneller uit te voeren"],
        correct:"B",
        feedback:"`console.log()` helpt je te controleren of je code doet wat je verwacht."
      }
    ];

    const totalQuestions = quiz.length;
    let answeredCount = 0;
    let correctCount = 0;

    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const progressFill = document.getElementById("progress-fill");
    const resultPanel = document.getElementById("result-panel");
    const resultScore = document.getElementById("result-score");
    const resultMessage = document.getElementById("result-message");
    const quizList = document.getElementById("quiz-list");

    function escapeHtml(value) {
      return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatInline(value) {
      const escaped = escapeHtml(value);
      return escaped.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
    }

    function highlightCode(value) {
      let output = escapeHtml(value);
      output = output.replace(/(\/\/.*)$/gm, '<span class="token-comment">$1</span>');
      output = output.replace(/\b(let|const|var|typeof)\b/g, '<span class="token-keyword">$1</span>');
      output = output.replace(/\b(prompt|console\.log|Number|parseInt|String|toString)\b/g, '<span class="token-function">$1</span>');
      output = output.replace(/(&quot;[^&]*?&quot;|'[^']*?')/g, '<span class="token-string">$1</span>');
      output = output.replace(/(`[^`]*`)/g, '<span class="token-template">$1</span>');
      output = output.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="token-number">$1</span>');
      return output;
    }

    function renderQuiz() {
      quizList.innerHTML = quiz.map((item, index) => {
        const letters = ["A","B","C","D"];
        const answers = item.answers.map((answer, answerIndex) => `
          <button class="answer flex gap-3 rounded-xl p-4" data-option="${letters[answerIndex]}" type="button" role="radio" aria-checked="false">
            <span class="letter flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-sm font-bold">${letters[answerIndex]}</span>
            <span class="answer-copy">${formatInline(answer)}</span>
          </button>
        `).join("");

        return `
          <section id="q${index + 1}" class="question-card rounded-2xl border border-[#e8ebee] bg-[#fafafa] p-5" data-correct="${item.correct}">
            <p class="mb-2 text-sm font-bold uppercase tracking-[.18em] text-[#fa6432]">Vraag ${index + 1}</p>
            <h2 class="mb-${item.code ? "4" : "5"} text-xl font-semibold leading-relaxed text-[#000a1e]">${formatInline(item.question)}</h2>
            ${item.code ? `<pre class="code-block mb-5"><code>${highlightCode(item.code)}</code></pre>` : ""}
            <div class="space-y-3" role="radiogroup" aria-label="Antwoorden voor vraag ${index + 1}">
              ${answers}
            </div>
            <div class="feedback mt-5 rounded-r-xl p-4">
              <p>${formatInline(item.feedback)}</p>
            </div>
          </section>
        `;
      }).join("");

      bindAnswerEvents();
    }

    function updateProgress() {
      progressText.textContent = `Vraag ${answeredCount} van ${totalQuestions}`;
      scoreText.textContent = `Score: ${correctCount}`;
      progressFill.style.width = `${answeredCount / totalQuestions * 100}%`;
    }

    function showResults() {
      const percentage = Math.round(correctCount / totalQuestions * 100);
      resultScore.textContent = `Je behaalde ${correctCount} van de ${totalQuestions} juiste antwoorden (${percentage}%).`;
      resultMessage.textContent = percentage >= 80
        ? "Sterk werk! Je beheerst de kernconcepten al heel goed."
        : percentage >= 50
          ? "Goed bezig! Bekijk de uitleg bij de vragen die nog lastig waren."
          : "Blijf oefenen: de uitleg bij elke vraag helpt je om de concepten beter te begrijpen.";

      resultPanel.classList.add("show");
      resultPanel.scrollIntoView({ behavior:"smooth", block:"center" });
    }

    function checkIfAllWrong(card) {
      const correct = card.dataset.correct;
      const wrongAnswers = Array.from(card.querySelectorAll(".answer")).filter(
        btn => btn.dataset.option !== correct
      );
      return wrongAnswers.every(btn => btn.classList.contains("is-incorrect"));
    }

    function revealCorrectAnswer(card) {
      const correct = card.dataset.correct;
      card.querySelectorAll(".answer").forEach(choice => {
        choice.disabled = true;
        if (choice.dataset.option === correct) {
          choice.classList.add("is-revealed", "is-correct");
        }
      });
      card.classList.add("answered");
      card.querySelector(".feedback").classList.add("show");

      answeredCount += 1;
      correctCount += 1;

      updateProgress();

      if (answeredCount === totalQuestions) {
        showResults();
      }
    }

    function bindAnswerEvents() {
      document.querySelectorAll(".question-card").forEach(card => {
        card.querySelectorAll(".answer").forEach(button => {
          button.addEventListener("click", () => {
            if (card.classList.contains("answered")) return;

            const correct = card.dataset.correct;
            const isCorrect = button.dataset.option === correct;

            if (isCorrect) {
              button.classList.add("is-correct");
              revealCorrectAnswer(card);
            } else {
              button.classList.add("is-incorrect");
              button.disabled = true;
              button.setAttribute("aria-checked", "false");

              if (checkIfAllWrong(card)) {
                revealCorrectAnswer(card);
              }
            }
          });
        });
      });
    }

    document.getElementById("restart-button").addEventListener("click", () => {
      answeredCount = 0;
      correctCount = 0;
      resultPanel.classList.remove("show");

      document.querySelectorAll(".question-card").forEach(card => {
        card.classList.remove("answered");
        card.querySelector(".feedback").classList.remove("show");

        card.querySelectorAll(".answer").forEach(button => {
          button.disabled = false;
          button.setAttribute("aria-checked", "false");
          button.classList.remove("is-correct", "is-incorrect", "is-revealed");
        });
      });

      updateProgress();
      document.getElementById("q1").scrollIntoView({ behavior:"smooth", block:"start" });
    });

    renderQuiz();
    updateProgress();
    lucide.createIcons();
  </script>
 
</body></html>
